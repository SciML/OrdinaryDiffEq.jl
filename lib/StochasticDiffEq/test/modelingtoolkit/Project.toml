# Temporary: registered ModelingToolkit does not admit JumpProcesses 10, so test against
# its JumpProcesses 10 branch (SciML/ModelingToolkit.jl#5269). Remove, along with
# ModelingToolkitBase in [deps], before merging; this group then cannot resolve until a
# ModelingToolkitBase release that admits JumpProcesses 10 is registered.
ModelingToolkit = {url = "https://github.com/isaacsas/ModelingToolkit.jl.git", rev = "mtkbase/jumpprocesses-v10"}
ModelingToolkitBase = {url = "https://github.com/isaacsas/ModelingToolkit.jl.git", rev = "mtkbase/jumpprocesses-v10", subdir = "lib/ModelingToolkitBase"}

