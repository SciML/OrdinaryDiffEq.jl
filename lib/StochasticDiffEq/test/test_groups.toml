[Interface1]
versions = ["lts", "1", "pre"]

[Interface2]
versions = ["lts", "1", "pre"]

[Interface3]
versions = ["lts", "1", "pre"]

[AlgConvergence]
versions = ["1"]

# `["self-hosted", "Linux", "X64"]` is the largest pool the SciML fleet actually
# answers (8 vCPU / 16 GB). No runner carries a `high-memory` label, so asking
# for one parks the job in the queue until GitHub expires it at 24h -- and this
# group is not local_only, so it is in nearly every Sublibrary CI matrix and
# hangs the whole workflow run with it.
[NoncommutativeConvergence]
versions = ["1"]
runner = ["self-hosted", "Linux", "X64"]
timeout = 240

[AlgConvergence2]
versions = ["1"]

[AlgConvergence3]
versions = ["1"]

# Weak-convergence groups are extremely expensive (Monte-Carlo trajectory
# studies) and only exercise StochasticDiffEq's own weak solvers, so they are
# marked local_only: they run when this package's source/tests are edited but
# are skipped when this package is only pulled into the matrix because an
# upstream dependency changed. See compute_affected_sublibraries.jl.

[WeakConvergence1]
versions = ["1"]
local_only = true

[OOPWeakConvergence]
versions = ["1"]
runner = ["self-hosted", "Linux", "X64"]
timeout = 300
local_only = true

[IIPWeakConvergence]
versions = ["1"]
runner = ["self-hosted", "Linux", "X64"]
timeout = 300
local_only = true

[Multithreaded]
versions = ["1"]
runner = ["self-hosted", "Linux", "X64"]
num_threads = 2
timeout = 240

[WeakAdaptiveGPU]
versions = ["1"]
runner = ["self-hosted", "Linux", "X64", "gpu"]
timeout = 240
local_only = true

[Allocations]
versions = ["1"]

[StaticAnalysis]
versions = ["1"]

[QA]
versions = ["lts", "1"]
